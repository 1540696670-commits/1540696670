<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审图网站</title>
<style>
  :root {
    --bg:#08080d; --surface:rgba(255,255,255,0.025); --surface-hover:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.07); --border-active:rgba(255,255,255,0.14);
    --text:rgba(255,255,255,0.82); --text-dim:rgba(255,255,255,0.45); --text-bright:rgba(255,255,255,0.93);
    --accent:#c9a95c; --accent-dim:rgba(201,169,92,0.15); --accent-glow:rgba(201,169,92,0.35);
    --danger:#d9705a; --danger-dim:rgba(217,112,90,0.15); --success:#7eb896; --info:#6ba3c7;
    --radius:6px; --radius-lg:10px;
    --font-heading:"Playfair Display","STSong","Songti SC","Noto Serif SC",serif;
    --font-body:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:var(--font-body);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* Header */
  .header{flex-shrink:0;padding:12px 20px 0;border-bottom:1px solid var(--border)}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .header h1{font-family:var(--font-heading);font-size:1.4rem;font-weight:700;color:var(--text-bright);letter-spacing:0.06em}
  .header .sub{font-size:0.72rem;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase}

  /* Mode Tabs */
  .mode-tabs{display:flex;gap:0}
  .mode-tab{padding:8px 18px;font-size:0.82rem;cursor:pointer;border:none;background:transparent;color:var(--text-dim);border-bottom:2px solid transparent;transition:all 0.2s;font-family:var(--font-body);letter-spacing:0.03em;white-space:nowrap}
  .mode-tab:hover{color:var(--text);border-bottom-color:rgba(255,255,255,0.15)}
  .mode-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .mode-tab .mt-badge{font-size:0.62rem;padding:1px 5px;border-radius:100px;margin-left:4px;background:var(--accent-dim);color:var(--accent);vertical-align:middle}

  /* Layout */
  .main{flex:1;display:flex;overflow:hidden}
  .panel-left{width:38%;min-width:340px;max-width:480px;border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
  .panel-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#05050a}
  @media(max-width:900px){
    .main{flex-direction:column}
    .panel-left{width:100%;min-width:0;max-width:none;border-right:none;border-bottom:1px solid var(--border);max-height:42vh}
    .panel-right{max-height:58vh}
    .header{padding:8px 10px 0}.header h1{font-size:1.1rem}
    .mode-tab{padding:6px 10px;font-size:0.72rem}
  }

  /* Sections */
  .section{padding:16px 20px;border-bottom:1px solid var(--border)}
  .sec-title{font-family:var(--font-heading);font-size:0.88rem;font-weight:600;color:var(--text-bright);margin-bottom:10px;display:flex;align-items:center;gap:6px;letter-spacing:0.03em}
  .sec-title .ic{color:var(--accent)}
  .sec-desc{font-size:0.73rem;color:var(--text-dim);margin-bottom:10px;line-height:1.5}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--radius);font-size:0.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);letter-spacing:0.02em;transition:all 0.2s;white-space:nowrap}
  .btn:hover{border-color:var(--border-active);background:var(--surface-hover)}
  .btn-primary{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:#d4b56a;border-color:#d4b56a;box-shadow:0 0 20px var(--accent-glow)}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}
  .btn-sm{padding:5px 10px;font-size:0.72rem}
  .btn-danger{border-color:var(--danger);color:var(--danger)}.btn-danger:hover{background:var(--danger-dim)}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  /* Upload zone */
  .up-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:22px 14px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surface);position:relative}
  .up-zone:hover,.up-zone.drag{border-color:var(--accent);background:var(--accent-dim)}
  .up-zone.done{border-color:var(--success);border-style:solid;background:rgba(126,184,150,0.05)}
  .up-zone .up-ic{font-size:1.5rem;margin-bottom:4px;opacity:0.5}
  .up-zone .up-txt{font-size:0.8rem;color:var(--text-dim)}
  .up-zone .up-hint{font-size:0.68rem;color:var(--text-dim);opacity:0.5;margin-top:2px}
  .up-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

  /* Input fields */
  .inp{width:100%;padding:8px 10px;border-radius:var(--radius);font-size:0.8rem;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;transition:border-color 0.2s;margin-bottom:6px}
  .inp:focus{border-color:var(--accent)}
  .inp::placeholder{color:var(--text-dim);opacity:0.6}

  /* Reg file list */
  .rf-item{display:flex;align-items:center;gap:6px;padding:7px 10px;margin-top:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:0.78rem}
  .rf-item .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .rf-item .fi{font-size:0.7rem;color:var(--text-dim);flex-shrink:0}

  /* PDF Viewer */
  .pdf-viewer{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px}
  .pdf-pwrap{position:relative;margin:0 auto 12px;box-shadow:0 3px 16px rgba(0,0,0,0.45);background:#fff;line-height:0}
  .pdf-pwrap canvas{display:block;width:100%;height:auto}
  .pdf-pwrap .hl-layer{position:absolute;inset:0;pointer-events:none}
  .pdf-pwrap .hl-rect{position:absolute;background:rgba(217,112,90,0.3);border:2px solid rgba(255,120,80,0.75);border-radius:2px;animation:hlPulse 1.2s ease-in-out infinite}
  @keyframes hlPulse{0%,100%{background:rgba(217,112,90,0.25)}50%{background:rgba(255,130,90,0.5)}}

  /* Results bar */
  .res-bar{border-top:1px solid var(--border);background:var(--bg);max-height:44%;overflow-y:auto;flex-shrink:0}
  .res-hd{padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
  .res-hd .tab{padding:5px 12px;border-radius:100px;font-size:0.76rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:all 0.15s;white-space:nowrap}
  .res-hd .tab.active,.res-hd .tab:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .res-hd .tab .badge{padding:1px 6px;border-radius:100px;font-size:0.66rem;margin-left:3px;background:var(--danger-dim);color:var(--danger)}
  .res-list{padding:8px 14px;font-size:0.8rem}

  /* Issue cards */
  .iss{cursor:pointer;padding:9px 11px;margin-bottom:5px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--radius);transition:all 0.15s;font-size:0.8rem}
  .iss:hover,.iss.act{border-color:var(--danger);background:var(--danger-dim);box-shadow:0 0 10px rgba(217,112,90,0.1)}
  .iss .is{font-weight:600;color:var(--text-bright);margin-bottom:2px}
  .iss .im{font-size:0.72rem;color:var(--text-dim)}
  .iss .ikw{display:inline-block;background:var(--danger-dim);color:var(--danger);padding:1px 5px;border-radius:3px;font-size:0.68rem;margin:0 1px}
  .iss .ip{font-size:0.7rem;color:var(--info);margin-top:2px}

  /* Typo items */
  .tyi{cursor:pointer;padding:7px 9px;margin-bottom:3px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);transition:all 0.15s;font-size:0.78rem;display:flex;align-items:center;gap:8px}
  .tyi:hover,.tyi.act{border-color:var(--accent);background:var(--accent-dim)}
  .tyi .tw{color:var(--danger);text-decoration:line-through;min-width:50px;font-size:0.8rem}
  .tyi .ta{color:var(--text-dim)}
  .tyi .tc{color:var(--success);font-weight:600;font-size:0.8rem}
  .tyi .tp{flex:1;text-align:right;font-size:0.68rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Summary */
  .sum-row{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px}
  .chip{padding:5px 12px;border-radius:100px;font-size:0.74rem;border:1px solid var(--border);background:var(--surface)}
  .chip.warn{border-color:var(--danger);background:var(--danger-dim);color:var(--danger)}
  .chip.ok{border-color:var(--success);background:rgba(126,184,150,0.1);color:var(--success)}
  .chip.info{border-color:var(--info);background:rgba(107,163,199,0.1);color:var(--info)}

  /* ===== NEW v3 STYLES ===== */

  /* Result table */
  .res-table{width:100%;border-collapse:collapse;font-size:0.76rem;margin:6px 0}
  .res-table th,.res-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  .res-table th{font-size:0.7rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;position:sticky;top:0;background:var(--bg)}
  .res-table tr:hover td{background:var(--surface-hover)}
  .res-table .td-pass{color:var(--success);font-weight:600}
  .res-table .td-fail{color:var(--danger);font-weight:600}
  .res-table .td-src{font-size:0.68rem;color:var(--text-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-table .td-clause{max-width:300px;line-height:1.4}

  /* Code/highlight text */
  .hl-text{background:var(--accent-dim);color:var(--accent);padding:1px 4px;border-radius:3px;font-size:0.85em}
  .kw-text{background:var(--danger-dim);color:var(--danger);padding:1px 4px;border-radius:3px;font-size:0.85em}

  /* Select dropdown */
  .sel{width:100%;padding:8px 10px;border-radius:var(--radius);font-size:0.8rem;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;cursor:pointer;margin-bottom:6px}
  .sel:focus{border-color:var(--accent)}
  .sel option{background:#1a1a24;color:var(--text)}

  /* Progress */
  .progress-wrap{height:4px;background:var(--border);border-radius:10px;margin:8px 0;overflow:hidden}
  .progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width 0.3s;width:0%}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid var(--border-active);padding:10px 22px;border-radius:100px;font-size:0.8rem;color:var(--text);z-index:200;box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:tIn 0.25s ease,tOut 0.25s ease 2s forwards}
  @keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes tOut{from{opacity:1}to{opacity:0}}

  /* KB indicator */
  .kb-status{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;color:var(--text-dim)}
  .kb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .kb-dot.on{background:var(--success);box-shadow:0 0 6px rgba(126,184,150,0.5)}
  .kb-dot.off{background:var(--danger);box-shadow:0 0 6px rgba(217,112,90,0.4)}
  .kb-dot.checking{background:var(--accent);animation:kbPulse 0.8s ease-in-out infinite}
  @keyframes kbPulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* Misc */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.12)}
  .hidden{display:none!important}
  .empty{text-align:center;padding:40px 20px;color:var(--text-dim)}
  .empty .big{font-size:2.5rem;opacity:0.15;margin-bottom:8px}
  details summary{font-size:0.73rem;color:var(--accent);cursor:pointer;margin-top:4px}
  .mt-2{margin-top:8px}
  .mt-4{margin-top:16px}
  .mb-2{margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div><h1>审图网站</h1><div class="sub">Drawing Review System v4</div></div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="kb-status" id="kbStatus" title="知识库服务器连接状态">
          <span class="kb-dot checking" id="kbDot"></span>
          <span class="kb-status-text" id="kbStatusText">检测中...</span>
        </span>
        <button class="btn btn-sm btn-danger" onclick="resetAll()">重置全部数据</button>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="switchMode('manage')" id="tabManage">&#128214; 规范管理</button>
      <button class="mode-tab" onclick="switchMode('smart')" id="tabSmart">&#128300; 智能审图<span class="mt-badge">新</span></button>
      <button class="mode-tab" onclick="switchMode('search')" id="tabSearch">&#128269; 规范检索<span class="mt-badge">新</span></button>
      <button class="mode-tab" onclick="switchMode('scan')" id="tabScan">&#9889; 一键扫描<span class="mt-badge">新</span></button>
    </div>
  </header>

  <div class="main">
    <!-- ===== LEFT PANEL ===== -->
    <div class="panel-left" id="panelLeft"><!-- mode panels injected here --></div>

    <!-- ===== RIGHT PANEL ===== -->
    <div class="panel-right">
      <div class="pdf-viewer" id="pdfViewer">
        <div class="empty" id="pdfEmpty">
          <div class="big">&#128196;</div><div>图纸 PDF 预览区</div>
          <div style="font-size:0.72rem;opacity:0.5;">上传图纸后在此预览，结果可点击跳转定位</div>
        </div>
        <div id="pdfPages"></div>
      </div>
      <div class="res-bar hidden" id="resBar">
        <div class="res-hd" id="resHd"></div>
        <div class="sum-row" id="sumRow"></div>
        <div class="res-list" id="resList"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ===================================================================
   1. INIT & GLOBALS
   =================================================================== */
if(typeof pdfjsLib!=='undefined') pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const BUILTIN_TYPOS = [
  ['混泥土','混凝土'],['刚筋','钢筋'],['防活等级','防火等级'],['砂桨','砂浆'],['沉将','沉降'],
  ['承裁力','承载力'],['伐板','筏板'],['密实渡','密实度'],['含水绿','含水率'],['剪立墙','剪力墙'],
  ['钢筋拢','钢筋笼'],['防水卷才','防水卷材'],['防离层','防裂层'],['保温版','保温板'],['变型缝','变形缝'],
  ['伸缩锋','伸缩缝'],['止水袋','止水带'],['铆筋','锚筋'],['毛杆','锚杆'],['桩基储','桩基础'],
  ['垫曾','垫层'],['保护层厚渡','保护层厚度'],['抗正等级','抗震等级'],['设房烈度','设防烈度'],
  ['防伙分区','防火分区'],['消房车道','消防车道'],['疏敞宽度','疏散宽度'],['地基再载力','地基承载力'],
  ['模版支撑','模板支撑'],['气蜜性','气密性'],['遮荫系数','遮阳系数'],['结构归则性','结构规则性'],
  ['惦面','垫层'],['图约','图纸'],['打桩机储','打桩基础'],['储仓','储藏']
];

const SK={REGF:'reg_files_v3',REGKW:'reg_keywords_v3'};
let regFiles=[]; try{regFiles=JSON.parse(localStorage.getItem(SK.REGF)||'[]')||[];}catch(e){}
let regKeywords=[]; try{regKeywords=JSON.parse(localStorage.getItem(SK.REGKW)||'[]')||[];}catch(e){}
let drawPages=[],drawFileName='',drawPDF=null;
let checkIssues=[],checkTypos=[],checkUnits=[];
let activeMode='manage',activeTab='issues',currentHlPage=-1;
// v3 state
let smartRegText='',smartDrawPages=[],smartDrawPDF=null,smartDrawName='';
let scanDrawPages=[],scanDrawPDF=null,scanDrawName='';
// KB server state
const KB_SERVER='http://127.0.0.1:8765';
let kbConnected=false,kbChecking=false;

/* ===================================================================
   2. UTILS
   =================================================================== */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toast(m){const e=document.querySelector('.toast');if(e)e.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
function $(id){return document.getElementById(id);}
function saveRegs(){try{localStorage.setItem(SK.REGF,JSON.stringify(regFiles))}catch(e){toast('存储空间不足')}}
function saveKW(){try{localStorage.setItem(SK.REGKW,JSON.stringify(regKeywords))}catch(e){toast('存储空间不足')}}

/* ===================================================================
   2b. KB CLIENT
   =================================================================== */
async function kbFetch(path,options={}){
  const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),8000);
  try{const r=await fetch(KB_SERVER+path,{...options,signal:ctrl.signal});clearTimeout(t);return r;}
  catch(e){clearTimeout(t);throw e;}
}
async function kbSearch(query,topK=10){
  const r=await kbFetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,top_k:topK})});
  if(!r.ok)throw new Error('Search failed');
  return await r.json();
}
async function kbGetClause(id){
  const r=await kbFetch('/clause?id='+encodeURIComponent(id));
  if(!r.ok)throw new Error('Clause not found');
  return await r.json();
}
async function checkKBConnection(){
  if(kbChecking)return;kbChecking=true;
  updateKBIndicator('checking');
  try{const r=await kbFetch('/health');const d=await r.json();kbConnected=(d.status==='ok');}
  catch(e){kbConnected=false;}
  kbChecking=false;updateKBIndicator();
}
function updateKBIndicator(state){
  const dot=$('kbDot'),txt=$('kbStatusText');
  if(!dot||!txt)return;
  if(state==='checking'){dot.className='kb-dot checking';txt.textContent='检测中...';}
  else if(kbConnected){dot.className='kb-dot on';txt.textContent='KB已连接';}
  else{dot.className='kb-dot off';txt.textContent='KB离线';}
}

/* ===================================================================
   3. MODE SWITCHING
   =================================================================== */
function switchMode(mode){
  activeMode=mode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  const tabMap={manage:'tabManage',smart:'tabSmart',search:'tabSearch',scan:'tabScan'};
  if($(tabMap[mode]))$(tabMap[mode]).classList.add('active');
  renderLeftPanel();
  // clear results
  $('resBar').classList.add('hidden');$('resList').innerHTML='';$('sumRow').innerHTML='';
  $('resHd').innerHTML='';
}

function renderLeftPanel(){
  const p=$('panelLeft');
  switch(activeMode){
    case 'manage': p.innerHTML=panelManageHTML(); bindManageEvents(); break;
    case 'smart':  p.innerHTML=panelSmartHTML();  bindSmartEvents(); break;
    case 'search': p.innerHTML=panelSearchHTML(); bindSearchEvents(); break;
    case 'scan':   p.innerHTML=panelScanHTML();   bindScanEvents(); break;
  }
  // Restore manage state
  if(activeMode==='manage') renderRegUI();
}

/* ===================================================================
   4. PANEL HTML TEMPLATES
   =================================================================== */
function panelManageHTML(){return `
  <div class="section">
    <div class="sec-title"><span class="ic">&#128214;</span>规范库 · 上传本地规范PDF文件夹</div>
    <div class="up-zone" id="regZone">
      <div class="up-ic">&#128193;</div>
      <div class="up-txt">点击选择包含规范 PDF 的文件夹</div>
      <div class="up-hint">自动提取文字并生成审查关键词</div>
      <input type="file" id="regInput" webkitdirectory multiple accept=".pdf">
    </div>
    <div id="regList" style="margin-top:6px;"></div>
    <div class="text-dim" id="regSum" style="margin-top:4px;display:none;"></div>
    <div class="btn-row">
      <button class="btn btn-sm btn-primary" id="btnKW" disabled>提取关键词</button>
      <button class="btn btn-sm btn-danger" id="btnClearReg" disabled>清空规范库</button>
    </div>
    <div id="kwBox" style="margin-top:8px;display:none;"></div>
  </div>
  <div class="section">
    <div class="sec-title"><span class="ic">&#128196;</span>上传图纸 PDF</div>
    <div class="up-zone" id="drawZone">
      <div class="up-ic">&#128206;</div>
      <div class="up-txt" id="drawTxt">拖拽或点击上传图纸 PDF</div>
      <div class="up-hint">.pdf 格式</div>
      <input type="file" id="drawInput" accept=".pdf">

function bindManageEvents(){

async function onRegFolder(e){
  const files=Array.from(e.target.files).filter(f=>f.name.toLowerCase().endsWith('.pdf'));
  if(!files.length){toast('未找到PDF文件');return}
  $('regZone').querySelector('.up-txt').textContent='正在解析 '+files.length+' 个规范文件...';
  const added=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      let txt='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(it=>it.str).join('')+'\n';}
      added.push({name:f.name,text:txt,pageCount:pdf.numPages});
    }catch(err){console.warn(f.name,err)}
  }
  if(!added.length){toast('解析失败');return}
  regFiles=[...regFiles,...added];
  const seen=new Set();regFiles=regFiles.filter(f=>{if(seen.has(f.name))return false;seen.add(f.name);return true;});
  saveRegs();renderRegUI();e.target.value='';
  $('regZone').classList.add('done');$('regZone').querySelector('.up-txt').textContent='已加载 '+regFiles.length+' 个规范（可重新选择）';
  toast('已加载 '+added.length+' 个规范文件');
}

function renderRegUI(){
  const list=$('regList'),sum=$('regSum'),zone=$('regZone');
  if(!regFiles.length){
    list.innerHTML='';sum.style.display='none';$('btnKW').disabled=true;$('btnClearReg').disabled=true;
    zone.classList.remove('done');zone.querySelector('.up-txt').textContent='点击选择包含规范 PDF 的文件夹';
    return;
  }
  list.innerHTML=regFiles.map(f=>`<div class="rf-item"><span style="color:var(--accent)">&#128214;</span><span class="fn">${esc(f.name)}</span><span class="fi">${f.pageCount}页 · ${f.text.length}字</span></div>`).join('');
  sum.style.display='block';
  sum.innerHTML='共 <strong>'+regFiles.length+'</strong> 个规范文件'+(regKeywords.length?' · 已提取 <strong>'+regKeywords.length+'</strong> 个关键词':' · 尚未提取关键词');
  zone.classList.add('done');zone.querySelector('.up-txt').textContent='已加载 '+regFiles.length+' 个规范（可重新选择）';

}

function clearRegs(){
  if(!confirm('确定清空所有规范文件和关键词吗？'))return;
  regFiles=[];regKeywords=[];saveRegs();saveKW();renderRegUI();
  $('kwBox').style.display='none';$('kwBox').innerHTML='';updateCheckBtn();toast('规范库已清空');
}

function extractKW(){
  if(!regFiles.length){toast('请先上传规范文件');return}
  const allText=regFiles.map(f=>f.text).join('\n');
  const sentences=allText.split(/[。！？；\n]+/).filter(s=>s.length>5);
  const normative=/[应必须不得禁止]/;
  const normSent=sentences.filter(s=>normative.test(s)&&s.length<200);
  const freq={};
  for(const sent of normSent){
    const clean=sent.replace(/[，、：；（）\(\)\[\]【】""''\s\d\.\,\;\:\-]+/g,'');
    for(let len=3;len<=7;len++){
      for(let i=0;i<=clean.length-len;i++){
        const g=clean.slice(i,i+len);
        if(/^[一-鿿]+$/.test(g)) freq[g]=(freq[g]||0)+1;
      }
    }
  }
  const stop=new Set(['应符合下列','应符合国家','应符合本','应符合现行','必须符合','不得小于','不应小于','不宜小于','应大于','必须大于','不得大于','不宜大于','且不应','且不得','且必须','同时应','并且应','以及应','或者应','建筑工程的','建筑工程','应符合','应按照','应严格','应遵照','应执行','的规定','规定执行','规定进行','国家现行','现行国家','现行标准','国家标准','规范规定','本规范','本规定','本标准','下列规定','下列标准','应当符合','应当遵守','应当执行','应当满足','必须满足','必须遵守','按下列','按以下','按照下列','按照以下','以下规定','以上规定','的要求','求进行','进行设计','设计时应','设计必须','设计中应','在设计中','在施工中','施工时应','使用时','采用时','设置时','布置时']);
  const filtered=Object.entries(freq).filter(([g,f])=>f>=2&&!stop.has(g)).sort((a,b)=>b[1]-a[1]);
  regKeywords=filtered.slice(0,200).map(([g])=>g);saveKW();
  const box=$('kwBox');box.style.display='block';
  box.innerHTML=`<div class="sec-title" style="font-size:0.78rem;">提取关键词（${regKeywords.length}个）</div>
    <div style="display:flex;flex-wrap:wrap;gap:3px;max-height:120px;overflow-y:auto;">${regKeywords.slice(0,100).map(k=>`<span style="font-size:0.68rem;padding:2px 6px;border-radius:3px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(201,169,92,0.2);">${esc(k)}</span>`).join('')}${regKeywords.length>100?`<span style="font-size:0.68rem;color:var(--text-dim);padding:2px 6px;">...共${regKeywords.length}个</span>`:''}</div>`;
  renderRegUI();toast('已提取 '+regKeywords.length+' 个关键词');
}

async function loadDrawing(file){
  drawFileName=file.name;drawPages=[];drawPDF=null;
  $('drawTxt').textContent='正在解析图纸...';$('drawZone').classList.add('done');
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;drawPDF=pdf;
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);const c=await pg.getTextContent();
      drawPages.push({pageNum:i,text:c.items.map(it=>it.str).join(''),items:c.items,viewport:pg.getViewport({scale:1})});
    }
    $('drawInfo').style.display='block';
    $('drawInfo').innerHTML='已加载：<strong>'+esc(file.name)+'</strong> · '+pdf.numPages+'页 · 约'+drawPages.reduce((s,p)=>s+p.text.length,0)+'字符';
    $('drawTxt').textContent='图纸已就绪';updateCheckBtn();
    await renderPDF(drawPDF,drawPages);toast('图纸解析完成，共'+pdf.numPages+'页');
  }catch(e){$('drawTxt').textContent='解析失败，请重试';$('drawZone').classList.remove('done');toast('解析失败：'+e.message)}
}

function updateCheckBtn(){$('btnCheck').disabled=!(drawPages.length&&regKeywords.length);}

/* ===================================================================
   6. PDF RENDERING (shared)
   =================================================================== */
async function renderPDF(pdfDoc,pagesArr){
  const viewer=$('pdfViewer'),empty=$('pdfEmpty'),pages=$('pdfPages');
  if(!pdfDoc||!pagesArr.length){empty.classList.remove('hidden');pages.innerHTML='';return}
  empty.classList.add('hidden');pages.innerHTML='';
  const cw=Math.max(viewer.clientWidth-32,300);
  for(const dp of pagesArr){
    const scale=cw/dp.viewport.width,w=Math.floor(dp.viewport.width*scale),h=Math.floor(dp.viewport.height*scale);
    const wrap=document.createElement('div');wrap.className='pdf-pwrap';wrap.id='pw'+dp.pageNum;
    wrap.style.width=w+'px';wrap.style.height=h+'px';
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.width=w+'px';cv.style.height=h+'px';cv.id='pc'+dp.pageNum;wrap.appendChild(cv);
    const hl=document.createElement('div');hl.className='hl-layer';hl.id='hl'+dp.pageNum;wrap.appendChild(hl);
    pages.appendChild(wrap);
    const pg=await pdfDoc.getPage(dp.pageNum);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:pg.getViewport({scale})}).promise;
  }
}

/* ===================================================================
   7. MODE: MANAGE CHECK & RESULTS
   =================================================================== */
function runCheck(){
  if(!drawPages.length){toast('请先上传图纸');return}
  if(!regKeywords.length){toast('请先上传规范文件并提取关键词');return}
  checkIssues=[];checkTypos=[];checkUnits=[];
  const fullText=drawPages.map(p=>p.text).join('');
  const pageMap=[];let offset=0;
  for(const dp of drawPages){pageMap.push({pageNum:dp.pageNum,start:offset,end:offset+dp.text.length});offset+=dp.text.length+1;}
  for(const kw of regKeywords){
    if(!fullText.includes(kw)){
      const srcRegs=regFiles.filter(f=>f.text.includes(kw)).map(f=>f.name.replace(/\.pdf$/i,''));
      checkIssues.push({keyword:kw,sources:srcRegs.length?srcRegs:['(规范库)']});
    }
  }
  for(const [wrong,correct] of BUILTIN_TYPOS){
    let idx=0;
    while(idx<fullText.length){
      const pos=fullText.indexOf(wrong,idx);if(pos===-1)break;
      const pgInfo=findPage(pos,pageMap);const ctx=getContext(fullText,pos,wrong.length);
      checkTypos.push({wrong,correct,pageNum:pgInfo?pgInfo.pageNum:1,context:ctx});
      idx=pos+1;
    }
  }
  const uRe=/(\d+(?:\.\d+)?)\s*(m²|m³|m{1,2}|cm|mm|km|kg|kN|MPa|℃|°)(?![a-zA-Z一-鿿])/g;
  let m;
  while((m=uRe.exec(fullText))!==null){
    if(!/^\d+(?:\.\d+)?\s+(?:m²|m³|m{1,2}|cm|mm|km|kg|kN|MPa|℃|°)/.test(m[0])){
      const pgInfo=findPage(m.index,pageMap);
      checkUnits.push({wrong:m[0],correct:m[1]+' '+m[2],pageNum:pgInfo?pgInfo.pageNum:1,context:getContext(fullText,m.index,m[0].length)});
    }
  }
  renderManageResults();showResBar('manage');
  if(checkIssues.length>0)switchResTab('issues');else switchResTab('typos');
  toast('核对完成 · '+checkIssues.length+'个不合理项 · '+(checkTypos.length+checkUnits.length)+'个文本错误');
}

function findPage(pos,pageMap){for(const pm of pageMap){if(pos>=pm.start&&pos<pm.end)return pm;}for(const pm of pageMap){if(pos<pm.start)return pm;}return pageMap[pageMap.length-1];}
function getContext(text,pos,len){const s=Math.max(0,pos-12),e=Math.min(text.length,pos+len+12);return (s>0?'…':'')+text.slice(s,e)+(e<text.length?'…':'');}

function renderManageResults(){

  else sum+='<div class="chip ok">规范合规</div>';

  else sum+='<div class="chip ok">文本无错误</div>';
  sum+='</div>';$('sumRow').innerHTML=sum;

function renderIssues(){
  const list=$('resList');
  if(checkIssues.length===0){list.innerHTML='<div class="empty" style="padding:20px;"><div style="font-size:1.5rem;opacity:0.3;">&#10003;</div><div>所有关键词均已在图纸中找到</div></div>';return;}
  list.innerHTML=checkIssues.map((iss,i)=>`
    <div class="iss" data-idx="${i}" onclick="jumpToIssue(${i})">
      <div class="is">缺失关键词 <span class="ikw">${esc(iss.keyword)}</span></div>
      <div class="im">来源规范：${iss.sources.map(s=>esc(s)).join('、')}</div>
      <div class="ip">&#128206; 点击在图纸中查找相关位置</div>
    </div>`).join('');
}

function renderTypos(){
  const all=[...checkTypos,...checkUnits.map(u=>({wrong:u.wrong,correct:u.correct,pageNum:u.pageNum,context:u.context,isUnit:true}))];
  if(all.length===0){$('resList').innerHTML='<div class="empty" style="padding:20px;"><div style="font-size:1.5rem;opacity:0.3;">&#10003;</div><div>未发现文本错误</div></div>';return;}
  $('resList').innerHTML=all.map((t,i)=>`
    <div class="tyi" onclick="jumpToTypo(${i})">
      <span class="tw">${esc(t.wrong)}</span><span class="ta">→</span><span class="tc">${esc(t.correct)}</span>
      <span class="tp" title="${esc(t.context)}">p.${t.pageNum} ${esc(t.context)}</span>
    </div>`).join('');
}

function jumpToIssue(idx){
  const iss=checkIssues[idx];if(!iss)return;
  let targetPage=1;
  const kwChars=[...iss.keyword];
  for(const dp of drawPages){const matchCount=kwChars.filter(c=>dp.text.includes(c)).length;if(matchCount>=kwChars.length*0.5){targetPage=dp.pageNum;break;}}
  navigateToPage(targetPage);
}

function jumpToTypo(idx){
  const all=[...checkTypos,...checkUnits.map(u=>({...u,isUnit:true}))];
  const t=all[idx];if(!t)return;
  navigateToPage(t.pageNum);
  highlightInPDF(t.pageNum,t.wrong);
}

function navigateToPage(pageNum){
  const wrap=$('pw'+pageNum);if(!wrap)return;
  wrap.scrollIntoView({behavior:'smooth',block:'center'});
  wrap.style.boxShadow='0 0 30px rgba(201,169,92,0.5), 0 3px 16px rgba(0,0,0,0.45)';
  setTimeout(()=>{wrap.style.boxShadow='0 3px 16px rgba(0,0,0,0.45)';},1500);
}

function highlightInPDF(pageNum,text){
  const dp=drawPages.find(p=>p.pageNum===pageNum);if(!dp)return;
  const wrap=$('pw'+pageNum);if(!wrap)return;
  const hlLayer=$('hl'+pageNum);if(!hlLayer)return;
  hlLayer.innerHTML='';
  const scale=parseFloat(wrap.style.width)/dp.viewport.width;
  for(const item of dp.items){
    if(item.str.includes(text)||text.includes(item.str)){
      const tx=item.transform;
      const x=tx[4]*scale;
      const y=(dp.viewport.height-tx[5])*scale-item.height*scale;
      const w=item.width*scale+2,h=item.height*scale+2;
      const rect=document.createElement('div');rect.className='hl-rect';
      rect.style.left=x+'px';rect.style.top=y+'px';rect.style.width=w+'px';rect.style.height=h+'px';
      hlLayer.appendChild(rect);
    }
  }
  setTimeout(()=>{hlLayer.innerHTML='';},4000);
}

let smartReqs=[]; // [{roomType, minArea, sourceReg, fullText}]
let smartRooms=[]; // [{roomName, area, pageNum}]

async function loadSmartDraw(file){

    }

function updateSmartBtn(){

// Room type display names
const ROOM_TYPES={
  '卧室':'卧室','双人卧室':'双人卧室','单人卧室':'单人卧室','兼起居的卧室':'兼起居的卧室',
  '兼起居室':'兼起居室','起居室':'起居室（客厅）','客厅':'起居室（客厅）','厨房':'厨房',
  '卫生间':'卫生间','厕所':'卫生间','阳台':'阳台','书房':'书房','餐厅':'餐厅',
  '储藏室':'储藏室','门厅':'门厅','走道':'走道','过道':'过道'
};

function extractAreaReqs(){
  if(!smartRegText){toast('请先加载规范');return}
  smartReqs=[];
  const patterns=[
    {re:/兼起居的卧室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'兼起居的卧室'},
    {re:/双人卧室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'双人卧室'},
    {re:/单人卧室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'单人卧室'},
    {re:/卧室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'卧室'},
    {re:/兼起居室.*?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'兼起居室'},
    {re:/起居室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'起居室'},
    {re:/客厅.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'客厅'},
    {re:/厨房.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'厨房'},
    {re:/卫生间.*?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'卫生间'},
    {re:/厕所.*?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'卫生间'},
    {re:/阳台.*?(?:使用)?面积(?:不应小于|不宜小于)\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'阳台'},
    {re:/书房.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'书房'},
    {re:/餐厅.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'餐厅'},
    {re:/储藏室.*?(?:使用)?面积不应小于\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g,type:'储藏室'},
  ];
  const seen=new Set();
  for(const{re,type} of patterns){
    let m;while((m=re.exec(smartRegText))!==null){
      const key=type+'|'+m[1];
      if(!seen.has(key)){
        seen.add(key);
        const ctx=getContext(smartRegText,m.index,m[0].length);
        smartReqs.push({roomType:type,minArea:parseFloat(m[1]),fullText:m[0],context:ctx});
      }
    }
  }
  // Also search with "不小于" as general fallback
  const gr=/(卧室|起居室|客厅|厨房|卫生间|厕所|阳台|书房|餐厅|储藏室|门厅|走道|过道).*?(?:面积).*?(?:不小于|不应小于|不宜小于|≥)\s*(\d+\.?\d*)\s*(?:[mM㎡²]|平米)?/g;
  let m2;while((m2=gr.exec(smartRegText))!==null){
    const key=m2[1]+'|'+m2[2];
    if(!seen.has(key)){
      seen.add(key);
      const ctx=getContext(smartRegText,m2.index,m2[0].length);
      smartReqs.push({roomType:m2[1],minArea:parseFloat(m2[2]),fullText:m2[0],context:ctx});
    }
  }
  if(!smartReqs.length){$('smartRegResult').innerHTML='<span style="color:var(--danger);">未找到面积要求条文，请确认规范内容包含房间面积规定。</span>';updateSmartBtn();return;}
  $('smartRegResult').innerHTML=`<div style="color:var(--success);font-weight:600;">&#10003; 已提取 ${smartReqs.length} 条面积要求：</div>`+
    smartReqs.map(r=>`<div style="margin-top:3px;font-size:0.72rem;padding:4px 8px;background:var(--surface);border-radius:var(--radius);"><span class="hl-text">${esc(r.roomType)}</span> ≥ <strong>${r.minArea}㎡</strong> <span style="color:var(--text-dim);">${esc(r.context)}</span></div>`).join('');
  updateSmartBtn();toast('已提取 '+smartReqs.length+' 条面积要求');
}

function extractRooms(){
  if(!smartDrawPages.length){toast('请先上传图纸');return}
  smartRooms=[];
  const fullText=smartDrawPages.map(p=>p.text).join('\n');
  // Build page map
  const pageMap=[];let offset=0;
  for(const dp of smartDrawPages){pageMap.push({pageNum:dp.pageNum,start:offset,end:offset+dp.text.length});offset+=dp.text.length+1;}
  // Room names
  const roomNames='主卧|次卧|客卧|儿童房|老人房|工人房|卧室|双人卧室|单人卧室|兼起居的卧室|起居室|客厅|厨房|卫生间|厕所|阳台|书房|餐厅|储藏室|储物间|门厅|玄关|走道|过道|多功能室|活动室|办公室|会议室|接待室|衣帽间|洗衣房|设备间|机房|配电间|水泵房';
  // Pattern: room name followed by area number (within same line)
  const roomRe=new RegExp('('+roomNames+').*?(\\d+\\.?\\d*)\\s*(?:[mM㎡²]|平米|平方)', 'g');
  let m;
  while((m=roomRe.exec(fullText))!==null){
    const pgInfo=findPage(m.index,pageMap);
    smartRooms.push({roomName:m[1],area:parseFloat(m[2]),pageNum:pgInfo?pgInfo.pageNum:1});
  }
  // Also try to find area numbers near room names using spatial proximity in PDF items
  const areaNearRe=/(\d+\.?\d*)\s*(?:[mM㎡²]|平米)/g;
  for(const dp of smartDrawPages){
    // Get items sorted by y then x (approximating reading order)
    const items=[...dp.items].sort((a,b)=>{
      const ya=a.transform[5],yb=b.transform[5];
      if(Math.abs(ya-yb)>10)return yb-ya;
      return a.transform[4]-b.transform[4];
    });
    const textLine=items.map(it=>it.str).join('');
    let am;while((am=areaNearRe.exec(textLine))!==null){
      const areaVal=parseFloat(am[1]);
      // Check if already captured
      const exists=smartRooms.some(r=>Math.abs(r.area-areaVal)<0.01&&r.pageNum===dp.pageNum);
      if(!exists){
        // Look backward for room name
        const pre=textLine.slice(Math.max(0,am.index-30),am.index);
        const rnMatch=pre.match(new RegExp('('+roomNames+')'));
        if(rnMatch){
          smartRooms.push({roomName:rnMatch[1],area:areaVal,pageNum:dp.pageNum});
        }
      }
    }
  }
  // Deduplicate
  const seenR=new Set();
  smartRooms=smartRooms.filter(r=>{const k=r.roomName+'|'+r.area+'|'+r.pageNum;if(seenR.has(k))return false;seenR.add(k);return true;});
  if(!smartRooms.length){$('smartDrawResult').innerHTML='<span style="color:var(--danger);">未检测到房间面积标注。请确认图纸包含房间名称和面积数据。</span>';updateSmartBtn();return;}
  $('smartDrawResult').innerHTML=`<div style="color:var(--success);font-weight:600;">&#10003; 已识别 ${smartRooms.length} 个房间：</div>`+
    smartRooms.slice(0,20).map(r=>`<span style="display:inline-block;margin:2px 4px;padding:2px 7px;border-radius:100px;font-size:0.7rem;background:var(--surface);border:1px solid var(--border);">${esc(r.roomName)} <strong>${r.area}㎡</strong></span>`).join('')+
    (smartRooms.length>20?`<span style="font-size:0.7rem;color:var(--text-dim);">...共${smartRooms.length}个</span>`:'');
  updateSmartBtn();toast('已识别 '+smartRooms.length+' 个房间');
}

async function runSmartReview(){
  if(!smartReqs.length||!smartRooms.length){toast('请先完成步骤1和步骤2');return}
  const results=[];
  for(const room of smartRooms){
    let matchedReq=null;
    for(const req of smartReqs){
      if(room.roomName.includes(req.roomType)||req.roomType.includes(room.roomName)){matchedReq=req;break;}
    }
    if(!matchedReq){
      if(/卧室/.test(room.roomName)) matchedReq=smartReqs.find(r=>r.roomType==='卧室');
      else if(/起居|客厅/.test(room.roomName)) matchedReq=smartReqs.find(r=>r.roomType==='起居室'||r.roomType==='客厅');
      else if(/厨房/.test(room.roomName)) matchedReq=smartReqs.find(r=>r.roomType==='厨房');
      else if(/卫生间|厕所/.test(room.roomName)) matchedReq=smartReqs.find(r=>r.roomType==='卫生间');
    }
    const pass=matchedReq?room.area>=matchedReq.minArea:null;
    results.push({...room,reqType:matchedReq?matchedReq.roomType:'(未找到对应规范)',minArea:matchedReq?matchedReq.minArea:null,pass,reqText:matchedReq?matchedReq.fullText:'',kbClause:'',kbSource:'',suggestion:''});
  }

  // KB enrichment — fetch exact regulation clauses for each room
  if(kbConnected){
    $('btnSmartReview').disabled=true;
    $('btnSmartReview').textContent='正在查询知识库...';
    for(const r of results){
      if(!r.reqType||r.reqType==='(未找到对应规范)')continue;
      try{
        const query=r.reqType+' 使用面积 不应小于 不小于';
        const kbRes=await kbSearch(query,3);
        if(kbRes.results&&kbRes.results.length>0){
          const best=kbRes.results[0];
          r.kbClause=best.content||'';
          r.kbSource=best.source||'';
          if(r.pass===false){
            r.suggestion='建议将'+r.roomName+'面积从'+r.area+'㎡调整至≥'+r.minArea+'㎡，以满足'+r.kbSource+'中"'+r.reqType+'使用面积不应小于'+r.minArea+'㎡"的要求。';
          }else if(r.pass===true){
            r.suggestion='当前面积'+r.area+'㎡满足规范≥'+r.minArea+'㎡的要求。';
          }
        }
      }catch(e){/* KB query failed for this room, leave empty */}
    }
    $('btnSmartReview').textContent='开始智能审图';
    $('btnSmartReview').disabled=false;
  }

  // Generate suggestions for rooms where KB didn't provide one
  for(const r of results){
    if(!r.suggestion){
      if(r.pass===false){
        r.suggestion='建议将'+r.roomName+'面积从'+r.area+'㎡调整至≥'+r.minArea+'㎡。';
      }else if(r.pass===true){
        r.suggestion='符合规范要求。';
      }else{
        r.suggestion='知识库中未找到该房间类型的明确面积要求，建议查阅相关建筑设计规范。';
      }
    }
  }

  // Display results
  showResBar('smart');
  const failCount=results.filter(r=>r.pass===false).length;
  const passCount=results.filter(r=>r.pass===true).length;
  const unknownCount=results.filter(r=>r.pass===null).length;
  let sum='<div class="sum-row">';
  sum+='<div class="chip info">图纸：'+esc(smartDrawName)+'</div>';
  sum+='<div class="chip info">规范要求：'+smartReqs.length+'条</div>';
  if(kbConnected)sum+='<div class="chip ok">KB知识库：已关联</div>';
  if(failCount)sum+='<div class="chip warn">不合规：'+failCount+'间</div>';
  if(passCount)sum+='<div class="chip ok">合规：'+passCount+'间</div>';
  if(unknownCount)sum+='<div class="chip info">未匹配：'+unknownCount+'间</div>';
  sum+='</div>';$('sumRow').innerHTML=sum;

  const showKB=kbConnected&&results.some(r=>r.kbClause);
  $('resList').innerHTML=`
    <table class="res-table">
      <thead><tr>
        <th>房间名称</th><th>图纸面积</th><th>规范要求</th><th>状态</th>
        ${showKB?'<th>规范条文原文</th><th>修改建议</th>':''}
      </tr></thead>
      <tbody>${results.map(r=>`
        <tr>
          <td>${esc(r.roomName)}</td>
          <td>${r.area}㎡</td>
          <td>${r.minArea!==null?r.minArea+'㎡ ('+esc(r.reqType)+')':'—'}</td>
          <td class="${r.pass===true?'td-pass':r.pass===false?'td-fail':''}">${r.pass===true?'&#10003; 合规':r.pass===false?'&#10007; 面积不足':'未匹配规范'}</td>
          ${showKB?`
            <td class="td-clause">${r.kbClause?esc(r.kbClause.substring(0,200))+(r.kbClause.length>200?'...':'')+'<div style="font-size:0.66rem;color:var(--accent);margin-top:2px;">— '+esc(r.kbSource)+'</div>':'<span style="color:var(--text-dim);">—</span>'}</td>
            <td style="max-width:280px;font-size:0.74rem;line-height:1.4;">${esc(r.suggestion)}</td>
          `:''}
        </tr>`).join('')}</tbody>
    </table>`;
  if(failCount)toast('发现 '+failCount+' 个房间面积不足'+(kbConnected?'，已关联规范条文':''));
  else toast('审图完成，所有匹配房间均合规');
}

/* ===================================================================
   10. MODE: REGULATION SEARCH (规范检索)
   =================================================================== */
function bindSearchEvents(){
  $('searchFileCount').textContent=regFiles.length;
  $('btnSearch').disabled=!regFiles.length;
  $('btnSearch').addEventListener('click',runSearch);
  $('searchMain').addEventListener('input',()=>{$('btnSearch').disabled=!($('searchMain').value.trim()&&regFiles.length);});
  const hint=$('searchKBHint');
  if(hint)hint.innerHTML=kbConnected
    ?'<span style="color:var(--success);">&#10003; 知识库已连接，将使用语义搜索</span>'
    :'<span style="color:var(--text-dim);">知识库离线，使用精确匹配搜索</span>';
}

function runSearch(){
  const mainTerm=$('searchMain').value.trim();
  if(!mainTerm){toast('请输入主搜索词');return}
  if(!regFiles.length){toast('请先在"规范管理"中加载规范文件');return}
  const subRaw=$('searchSub').value.trim();
  const subTerms=subRaw?subRaw.split(/[,，、\s]+/).filter(Boolean):[];

  if(kbConnected){
    runKBSearch(mainTerm,subTerms);
  }else{
    runLocalSearch(mainTerm,subTerms);
  }
}

async function runKBSearch(mainTerm,subTerms){
  $('btnSearch').disabled=true;$('btnSearch').textContent='语义搜索中...';
  try{
    const kbRes=await kbSearch(mainTerm,30);
    let results=kbRes.results||[];
    // Post-filter by sub terms if provided
    if(subTerms.length&&results.length){
      results=results.filter(r=>subTerms.some(st=>r.content.includes(st)));
    }
    if(!results.length){toast('未找到匹配条文');$('btnSearch').disabled=false;$('btnSearch').textContent='搜索';return;}
    showResBar('search');
    $('sumRow').innerHTML='<div class="sum-row">'+
      '<div class="chip info">主搜索词：'+esc(mainTerm)+'</div>'+
      '<div class="chip ok">KB语义搜索</div>'+
      '<div class="chip info">匹配条文：'+results.length+'条</div>'+
      (subTerms.length?('<div class="chip info">子过滤：'+subTerms.map(esc).join('、')+'</div>'):'')+
      '</div>';
    $('resList').innerHTML=`
      <table class="res-table">
        <thead><tr><th style="width:5%;">#</th><th style="width:22%;">来源规范</th><th>条文内容</th><th style="width:8%;">相似度</th></tr></thead>
        <tbody>${results.map(r=>`
          <tr>
            <td style="font-size:0.7rem;color:var(--text-dim);">${r.chunk_index||''}</td>
            <td style="font-size:0.72rem;">${esc((r.source||'').replace(/\.pdf$/i,''))}</td>
            <td class="td-clause">${esc((r.content||'').substring(0,300))}</td>
            <td style="font-size:0.8rem;font-weight:600;color:${r.score>=0.7?'var(--success)':r.score>=0.5?'var(--accent)':'var(--text-dim)'};">${(r.score*100).toFixed(0)}%</td>
          </tr>`).join('')}</tbody>
      </table>`;
    toast('语义搜索完成，找到 '+results.length+' 条相关条文');
  }catch(e){toast('KB搜索失败，回退到本地搜索');runLocalSearch(mainTerm,subTerms);}
  $('btnSearch').disabled=false;$('btnSearch').textContent='搜索';
}

function runLocalSearch(mainTerm,subTerms){
  // Step 1: find files containing main term
  const matchedFiles=regFiles.filter(f=>f.text.includes(mainTerm));
  if(!matchedFiles.length){toast('未找到包含"'+mainTerm+'"的规范文件');return;}
  // Step 2: within matched files, find clauses containing sub terms
  const results=[];
  for(const file of matchedFiles){
    // Split into paragraphs
    const paras=file.text.split(/[\n\r]+/).filter(p=>p.trim().length>5);
    for(let pi=0;pi<paras.length;pi++){
      const para=paras[pi];
      if(subTerms.length===0){
        // No sub filter: show all paragraphs with main term
        if(para.includes(mainTerm)){
          results.push({fileName:file.name.replace(/\.pdf$/i,''),paragraph:para.substring(0,200),pageHint:Math.floor(pi*file.pageCount/paras.length)+1});
        }
      }else{
        // Show paragraphs that contain at least one sub term
        const hits=[];
        for(const st of subTerms){if(para.includes(st))hits.push(st);}
        if(hits.length>0){
          results.push({fileName:file.name.replace(/\.pdf$/i,''),paragraph:para.substring(0,200),pageHint:Math.floor(pi*file.pageCount/paras.length)+1,matchTerms:hits});
        }
      }
    }
  }
  if(!results.length){toast('未找到匹配条文');return;}
  showResBar('search');
  $('sumRow').innerHTML='<div class="sum-row">'+
    '<div class="chip info">主搜索词：'+esc(mainTerm)+'</div>'+
    '<div class="chip info">匹配文件：'+matchedFiles.length+'个</div>'+
    '<div class="chip info">匹配条文：'+results.length+'条</div>'+
    (subTerms.length?('<div class="chip info">子过滤：'+subTerms.map(esc).join('、')+'</div>'):'')+
    '</div>';
  $('resList').innerHTML=`
    <table class="res-table">
      <thead><tr><th style="width:25%;">规范文件</th><th style="width:15%;">匹配词</th><th>条文内容</th><th style="width:8%;">≈页码</th></tr></thead>
      <tbody>${results.map(r=>`
        <tr>
          <td style="font-size:0.72rem;">${esc(r.fileName)}</td>
          <td>${r.matchTerms?r.matchTerms.map(t=>`<span class="kw-text">${esc(t)}</span>`).join(' '):'<span class="hl-text">'+esc(mainTerm)+'</span>'}</td>
          <td class="td-clause">${esc(r.paragraph)}</td>
          <td style="font-size:0.7rem;color:var(--text-dim);">≈p.${r.pageHint}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  toast('找到 '+results.length+' 条相关条文');
}

/* ===================================================================
   11. MODE: ONE-CLICK SCAN (一键扫描)
   =================================================================== */
function bindScanEvents(){
  $('scanFileCount').textContent=regFiles.length;
  $('btnScan').disabled=!regFiles.length;
  const scz=$('scanDrawZone');
  scz.addEventListener('dragover',e=>{e.preventDefault();scz.classList.add('drag')});
  scz.addEventListener('dragleave',()=>scz.classList.remove('drag'));
  scz.addEventListener('drop',e=>{e.preventDefault();scz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf')loadScanDraw(f);else toast('请上传PDF文件')});
  $('scanDrawInput').addEventListener('change',e=>{if(e.target.files[0])loadScanDraw(e.target.files[0])});
  $('btnScan').addEventListener('click',runScan);
  const hint=$('scanKBHint');
  if(hint)hint.innerHTML=kbConnected
    ?'<span style="color:var(--success);">&#10003; 知识库已连接，将使用语义驱动扫描</span>'
    :'<span style="color:var(--text-dim);">知识库离线，使用关键词驱动扫描</span>';
}

async function loadScanDraw(file){
  scanDrawName=file.name;scanDrawPages=[];scanDrawPDF=null;
  $('scanDrawTxt').textContent='正在解析...';$('scanDrawZone').classList.add('done');
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;scanDrawPDF=pdf;
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);const c=await pg.getTextContent();
      scanDrawPages.push({pageNum:i,text:c.items.map(it=>it.str).join(''),items:c.items,viewport:pg.getViewport({scale:1})});
    }
    $('scanDrawTxt').textContent='已加载：'+esc(file.name)+' · '+pdf.numPages+'页';
    await renderPDF(scanDrawPDF,scanDrawPages);toast('总图解析完成');
  }catch(e){$('scanDrawTxt').textContent='解析失败';$('scanDrawZone').classList.remove('done');toast('解析失败')}
}

async function runScan(){
  if(!regFiles.length){toast('请先在"规范管理"中加载规范文件');return}
  const prog=$('scanProgress'),bar=$('scanBar'),status=$('scanStatus');
  prog.classList.remove('hidden');bar.style.width='0%';status.textContent='正在扫描...';

  let fireLaneClauses=[],rescueSiteClauses=[],identifiedReg='',kbUsed=false;

  if(kbConnected){
    // === KB-driven scan ===
    status.textContent='KB步骤1/3：语义检索消防车道要求...';
    bar.style.width='20%';
    try{
      const laneRes=await kbSearch('消防车道 宽度 设置 要求',15);
      if(laneRes.results){
        fireLaneClauses=laneRes.results.map(r=>({content:r.content,source:r.source||'',score:r.score}));
      }
    }catch(e){/* fall through to local */}

    bar.style.width='50%';
    status.textContent='KB步骤2/3：语义检索救援场地要求...';
    await sleep(80);
    try{
      const rescueRes=await kbSearch('救援场地 登高操作场地 设置 要求',15);
      if(rescueRes.results){
        rescueSiteClauses=rescueRes.results.map(r=>({content:r.content,source:r.source||'',score:r.score}));
      }
    }catch(e){/* fall through to local */}

    bar.style.width='70%';
    status.textContent='KB步骤3/3：识别主要防火规范...';
    await sleep(80);
    try{
      const regRes=await kbSearch('建筑设计防火规范 民用建筑 消防车道 救援场地',5);
      if(regRes.results&&regRes.results.length>0){
        const sources=[...new Set(regRes.results.map(r=>r.source))];
        identifiedReg=sources.slice(0,2).join('、');
        kbUsed=true;
      }
    }catch(e){/* fall through */}
  }

  // Fallback: local keyword classification if KB didn't return enough
  if(!kbUsed||fireLaneClauses.length<3||rescueSiteClauses.length<3){
    status.textContent='补充本地搜索...';
    bar.style.width='60%';
    const scores=[];
    const kwMap={'建筑设计防火规范':10,'建筑防火通用规范':10,'消防':3,'防火':2,'疏散':2,'民用建筑':1,'建筑设计防火':8,'防火规范':5,'建筑防火':4};
    for(const f of regFiles){
      let score=0;
      for(const [kw,w] of Object.entries(kwMap)){
        const re=new RegExp(kw,'g');const matches=f.text.match(re);
        if(matches)score+=matches.length*w;
      }
      if(score>0)scores.push({file:f,score});
    }
    scores.sort((a,b)=>b.score-a.score);
    if(scores.length&&!identifiedReg){
      identifiedReg=scores[0].file.name.replace(/\.pdf$/i,'');
    }
    // Supplement from local if KB results are sparse
    if(fireLaneClauses.length<3&&scores.length){
      const targetText=scores[0].file.text;
      const paras=targetText.split(/[\n\r]+/).filter(p=>p.trim().length>10);
      for(const p of paras){
        if(/消防车道/.test(p))fireLaneClauses.push({content:p.substring(0,300),source:scores[0].file.name,score:1});
        if(/(?:救援场地|消防救援场地|登高操作场地|消防登高)/.test(p))rescueSiteClauses.push({content:p.substring(0,300),source:scores[0].file.name,score:1});
      }
    }
  }

  // Deduplicate
  fireLaneClauses=fireLaneClauses.filter((c,i,a)=>a.findIndex(x=>x.content.substring(0,40)===c.content.substring(0,40))===i);
  rescueSiteClauses=rescueSiteClauses.filter((c,i,a)=>a.findIndex(x=>x.content.substring(0,40)===c.content.substring(0,40))===i);

  // Compliance check if site plan loaded
  bar.style.width='85%';
  status.textContent='分析合规性...';
  await sleep(80);
  let complianceHTML='';
  if(scanDrawPages.length){
    const siteText=scanDrawPages.map(p=>p.text).join('\n');
    const hasFireLane=/消防车道|消防通道/.test(siteText);
    const hasRescueSite=/救援场地|登高操作|消防救援/.test(siteText);
    const dims4m=siteText.match(/(?:车道|通道|道路).*?宽度.*?(\d+\.?\d*)\s*(?:[mM]|米)/);
    const dims15m=siteText.match(/(?:场地|登高).*?(?:长|长度).*?(\d+\.?\d*)\s*(?:[mM]|米)/);
    const dims10m=siteText.match(/(?:场地|登高).*?(?:宽|宽度).*?(\d+\.?\d*)\s*(?:[mM]|米)/);

    complianceHTML='<div style="margin-top:10px;padding:10px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);">'+
      '<div style="font-weight:600;margin-bottom:6px;">场地总图合规性初步分析</div>';
    complianceHTML+='<div style="font-size:0.76rem;">&#128204; 消防车道：'+(hasFireLane?'<span style="color:var(--success);">已在图中标注</span>':'<span style="color:var(--danger);">未在图中找到标注</span>')+'</div>';
    complianceHTML+='<div style="font-size:0.76rem;">&#128204; 救援场地：'+(hasRescueSite?'<span style="color:var(--success);">已在图中标注</span>':'<span style="color:var(--danger);">未在图中找到标注</span>')+'</div>';
    if(dims4m)complianceHTML+='<div style="font-size:0.76rem;">&#128207; 车道宽度标注：'+dims4m[0]+(parseFloat(dims4m[1])>=4?' <span style="color:var(--success);">≥4m ✓</span>':' <span style="color:var(--danger);"><4m ✗</span>')+'</div>';
    if(dims15m)complianceHTML+='<div style="font-size:0.76rem;">&#128207; 场地长度标注：'+dims15m[0]+(parseFloat(dims15m[1])>=15?' <span style="color:var(--success);">≥15m ✓</span>':' <span style="color:var(--danger);"><15m ✗</span>')+'</div>';
    if(dims10m)complianceHTML+='<div style="font-size:0.76rem;">&#128207; 场地宽度标注：'+dims10m[0]+(parseFloat(dims10m[1])>=10?' <span style="color:var(--success);">≥10m ✓</span>':' <span style="color:var(--danger);"><10m ✗</span>')+'</div>';
    complianceHTML+='<div style="font-size:0.68rem;color:var(--text-dim);margin-top:6px;">注：此分析基于图中的文字标注。建议结合图纸图形尺寸进行人工复核。</div></div>';
  }else{
    complianceHTML='<div style="margin-top:10px;padding:10px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);font-size:0.78rem;color:var(--text-dim);">未上传场地总图，无法进行合规性对比。请上传总图后重新扫描。</div>';
  }

  bar.style.width='100%';
  status.textContent='扫描完成';
  await sleep(200);
  prog.classList.add('hidden');

  // Display results
  showResBar('scan');
  $('sumRow').innerHTML='<div class="sum-row">'+
    '<div class="chip info">识别规范：'+esc(identifiedReg||'(未识别)')+'</div>'+
    (kbUsed?'<div class="chip ok">KB语义驱动</div>':'<div class="chip info">本地关键词驱动</div>')+
    '<div class="chip info">消防车道条文：'+fireLaneClauses.length+'条</div>'+
    '<div class="chip info">救援场地条文：'+rescueSiteClauses.length+'条</div>'+
    '</div>';

  let html='';
  if(identifiedReg){
    html+='<div class="sec-title" style="font-size:0.78rem;margin-top:8px;">&#128293; 识别到的防火规范</div>';
    html+='<div style="font-size:0.76rem;margin-bottom:6px;"><span style="display:inline-block;padding:3px 10px;border-radius:100px;font-size:0.72rem;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);">'+esc(identifiedReg)+'</span></div>';
  }

  html+='<div class="sec-title" style="font-size:0.78rem;margin-top:10px;">&#128663; 消防车道要求（'+fireLaneClauses.length+'条）</div>';
  if(fireLaneClauses.length){
    html+='<table class="res-table"><thead><tr><th style="width:5%;">#</th><th>条文内容</th>'+(kbUsed?'<th style="width:10%;">相似度</th><th style="width:18%;">来源</th>':'')+'</tr></thead><tbody>'+
      fireLaneClauses.map((c,i)=>`<tr>
        <td style="font-size:0.7rem;color:var(--text-dim);">${i+1}</td>
        <td class="td-clause">${esc((c.content||'').substring(0,300))}</td>
        ${kbUsed?`<td style="font-size:0.75rem;font-weight:600;color:${(c.score||0)>=0.7?'var(--success)':(c.score||0)>=0.5?'var(--accent)':'var(--text-dim)'};">${c.score?((c.score*100).toFixed(0)+'%'):'—'}</td>
        <td style="font-size:0.68rem;color:var(--text-dim);">${esc((c.source||'').replace(/\.pdf$/i,'').substring(0,30))}</td>`:''}
      </tr>`).join('')+'</tbody></table>';
  }else{html+='<div style="font-size:0.76rem;color:var(--text-dim);padding:6px;">未找到相关条文</div>';}

  html+='<div class="sec-title" style="font-size:0.78rem;margin-top:10px;">&#128506; 救援场地要求（'+rescueSiteClauses.length+'条）</div>';
  if(rescueSiteClauses.length){
    html+='<table class="res-table"><thead><tr><th style="width:5%;">#</th><th>条文内容</th>'+(kbUsed?'<th style="width:10%;">相似度</th><th style="width:18%;">来源</th>':'')+'</tr></thead><tbody>'+
      rescueSiteClauses.map((c,i)=>`<tr>
        <td style="font-size:0.7rem;color:var(--text-dim);">${i+1}</td>
        <td class="td-clause">${esc((c.content||'').substring(0,300))}</td>
        ${kbUsed?`<td style="font-size:0.75rem;font-weight:600;color:${(c.score||0)>=0.7?'var(--success)':(c.score||0)>=0.5?'var(--accent)':'var(--text-dim)'};">${c.score?((c.score*100).toFixed(0)+'%'):'—'}</td>
        <td style="font-size:0.68rem;color:var(--text-dim);">${esc((c.source||'').replace(/\.pdf$/i,'').substring(0,30))}</td>`:''}
      </tr>`).join('')+'</tbody></table>';
  }else{html+='<div style="font-size:0.76rem;color:var(--text-dim);padding:6px;">未找到相关条文</div>';}

  html+=complianceHTML;
  $('resList').innerHTML=html;
  toast('扫描完成 · '+(kbUsed?'KB语义驱动':'本地关键词驱动')+' · '+(identifiedReg||'无匹配'));
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ===================================================================
   12. RESET
   =================================================================== */
function resetAll(){
  if(!confirm('确定清除所有数据（规范库、关键词、图纸）吗？此操作不可恢复。'))return;
  regFiles=[];regKeywords=[];drawPages=[];drawFileName='';drawPDF=null;
  smartRegText='';smartDrawPages=[];smartDrawPDF=null;smartDrawName='';
  scanDrawPages=[];scanDrawPDF=null;scanDrawName='';
  smartReqs=[];smartRooms=[];
  checkIssues=[];checkTypos=[];checkUnits=[];
  saveRegs();saveKW();
  $('pdfEmpty').classList.remove('hidden');$('pdfPages').innerHTML='';
  $('resBar').classList.add('hidden');
  renderLeftPanel();toast('所有数据已清除');
}

/* ===================================================================
   13. INIT
   =================================================================== */
(function init(){
  renderLeftPanel();
  if(regKeywords.length){
    const box=$('kwBox');if(box)box.style.display='block';
    const kwHTML=`<div class="sec-title" style="font-size:0.78rem;">已提取关键词（${regKeywords.length}个）</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;max-height:80px;overflow-y:auto;">${regKeywords.slice(0,60).map(k=>`<span style="font-size:0.68rem;padding:2px 6px;border-radius:3px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(201,169,92,0.2);">${esc(k)}</span>`).join('')}${regKeywords.length>60?'<span style="font-size:0.68rem;color:var(--text-dim);padding:2px 6px;">...共'+regKeywords.length+'个</span>':''}</div>`;
    if(box)box.innerHTML=kwHTML;
  }
  updateCheckBtn();
  checkKBConnection();
  setInterval(checkKBConnection,30000);
})();
